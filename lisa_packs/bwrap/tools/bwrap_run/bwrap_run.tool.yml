tool_id: bwrap_run
pack_id: lisa-pack-bwrap
module_path: lisa_packs.bwrap.tools.bwrap_run.bwrap_run
description: "Run an argv inside a bubblewrap sandbox whose containment is set by the harness floor (session sandbox policy), not the model. Posture is floor-resolved: persistence ephemeral = writes discarded on exit; overlay = changes captured in a mergeable layer (persist/layer_id/capture paths); readonly = no writable paths. Overlay results are STAGED, never applied: read layer_review.md for the relay-the-layer_id, export->review->apply contract. The model passes tightening overrides (persistence/network/paths) that may only raise integrity above the floor, never loosen it; the floor's network/device/ipc and path visibility are emitted as bwrap argv. Every sandboxed result carries an `identity` block: you run as mapped root via a single-entry uid map, so files owned by other host uids display as nobody:nobody (overflow uid) - a display artifact, not a permissions change; see sandbox_ownership.md. Approval-gated indirectly: bash_run (approval_required) is the user-facing approval boundary and composes through this tool as its sandbox backend."
effect: execute
approval_required: false
stream_output: true
exportable: true
# Kernel wrapper timeout: 0 disables the wrapper (sdk/AUTHORING.md contract).
# bwrap_run self-bounds: its own timeout_seconds parameter (1-3600s, subject to
# the floor's timeout_ceiling_seconds) kills a silent child, streaming output
# publishes progress on lisa.tool_output while it runs, and bash_run's
# adoption path (the only composed caller) already grants a grace window sized
# past the model's wait. A wrapper lifetime bound cannot be sized to that —
# the 2026-10-05 shell turn cancelled a mid-flight child at 30s and stranded
# the command — so the tool declares itself self-bounding.
timeout_seconds: 0
